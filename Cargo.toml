[package]
name = "rpg-raid-shop"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19"

# Optional: faster compiles by dynamically linking Bevy during development.
# Enable with `--features dev` (or run via `dx serve --hot-patch --features dev`).
[features]
dev = ["bevy/dynamic_linking"]

# Compile our own code with light optimizations in dev so the game runs smoothly...
[profile.dev]
opt-level = 1

# ...but compile dependencies with full optimizations (they rarely change).
[profile.dev.package."*"]
opt-level = 3
